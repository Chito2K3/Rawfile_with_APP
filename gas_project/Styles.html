<style>
  :root {
    /* Minimalist Monochrome Clinical Theme Palette */
    --primary: #0284c7;
    --primary-hover: #0369a1;
    --primary-light: #f0f9ff;
    --primary-border: #bae6fd;
    --danger: #be123c;
    --danger-hover: #9f1239;
    --danger-light: #fff1f2;
    --danger-border: #fecdd3;
    --warning: #b45309;
    --warning-light: #fffbeb;
    --warning-border: #fde68a;
    --success: #047857;
    --success-light: #f0fdf4;
    --success-border: #bbf7d0;
    --slate-950: #020617;
    --slate-900: #0f172a;
    --slate-800: #1e293b;
    --slate-700: #334155;
    --slate-600: #475569;
    --slate-500: #64748b;
    --slate-400: #94a3b8;
    --slate-300: #cbd5e1;
    --slate-200: #e2e8f0;
    --slate-100: #f1f5f9;
    --slate-50: #f8fafc;
    --border-color: #e2e8f0;
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --shadow-sm: 0 1px 2px 0 rgb(15 23 42 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(15 23 42 / 0.07), 0 2px 4px -2px rgb(15 23 42 / 0.05);
    --shadow-lg: 0 10px 15px -3px rgb(15 23 42 / 0.08), 0 4px 6px -4px rgb(15 23 42 / 0.04);
    --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: var(--font-family);
    background-color: #f8fafc;
    color: var(--slate-800);
    line-height: 1.5;
    font-size: 13.5px;
    padding: 16px;
    -webkit-font-smoothing: antialiased;
  }

  /* Main Container */
  .app-container {
    max-width: 1200px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border-color);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 90vh;
  }

  /* Header - Minimalist Clinical Charcoal */
  .app-header {
    background: #0f172a;
    color: #ffffff;
    padding: 18px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--primary);
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header-icon {
    width: 36px;
    height: 36px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #38bdf8;
    flex-shrink: 0;
  }

  .header-institution {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #94a3b8;
    margin-bottom: 2px;
  }

  .header-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: #ffffff;
  }

  .header-subtitle {
    font-size: 11.5px;
    color: #94a3b8;
    font-weight: 400;
  }

  /* Stat Counters Banner */
  .stats-banner {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    padding: 14px 24px;
    background: #f8fafc;
    border-bottom: 1px solid var(--border-color);
  }

  .stat-card {
    background: #ffffff;
    padding: 12px 14px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow-sm);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .stat-card:hover {
    border-color: #cbd5e1;
    box-shadow: var(--shadow-md);
  }

  .stat-icon {
    width: 34px;
    height: 34px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .stat-card.total .stat-icon {
    background: #f1f5f9;
    color: #0f172a;
  }

  .stat-card.critical .stat-icon {
    background: #fff1f2;
    color: #be123c;
  }

  .stat-card.near .stat-icon {
    background: #fffbeb;
    color: #b45309;
  }

  .stat-card.zero .stat-icon {
    background: #f8fafc;
    color: #64748b;
    border: 1px solid #e2e8f0;
  }

  .stat-value {
    font-size: 17px;
    font-weight: 700;
    color: var(--slate-900);
    line-height: 1.2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
  }

  .stat-label {
    font-size: 10.5px;
    color: var(--slate-500);
    text-transform: uppercase;
    font-weight: 600;
    letter-spacing: 0.04em;
    margin-top: 2px;
  }

  /* Tab Navigation */
  .tab-nav {
    display: flex;
    background: #ffffff;
    border-bottom: 1px solid var(--border-color);
    padding: 0 24px;
    overflow-x: auto;
    gap: 4px;
  }

  .tab-btn {
    padding: 13px 18px;
    border: none;
    background: transparent;
    font-size: 13px;
    font-weight: 600;
    color: var(--slate-600);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 2px solid transparent;
    transition: all 0.15s ease;
    white-space: nowrap;
  }

  .tab-btn:hover {
    color: var(--slate-900);
    background: #f8fafc;
  }

  .tab-btn.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
    background: #ffffff;
  }

  /* Main Tab Content */
  .tab-content-area {
    padding: 24px;
    flex: 1;
  }

  .tab-pane {
    display: none;
  }

  .tab-pane.active {
    display: block;
    animation: fadeIn 0.15s ease-in-out;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(3px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Control Bar (Search & Filter) */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
    align-items: center;
  }

  .search-box {
    flex: 1;
    min-width: 250px;
    position: relative;
  }

  .search-input {
    width: 100%;
    padding: 9px 14px 9px 36px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    font-size: 13px;
    outline: none;
    transition: all 0.15s;
    background: #ffffff;
    color: var(--slate-900);
  }

  .search-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
  }

  .search-icon-inside {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--slate-400);
    display: flex;
    align-items: center;
  }

  .filter-select {
    padding: 9px 14px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    font-size: 13px;
    background: #ffffff;
    color: var(--slate-700);
    outline: none;
    cursor: pointer;
  }

  .filter-select:focus {
    border-color: var(--primary);
  }

  /* Minimalist Clinical Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: var(--radius-sm);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s ease;
    user-select: none;
  }

  .btn:active {
    transform: scale(0.99);
  }

  .btn-primary {
    background: var(--primary);
    color: #ffffff;
    border-color: var(--primary);
  }

  .btn-primary:hover {
    background: var(--primary-hover);
    border-color: var(--primary-hover);
  }

  .btn-danger {
    background: var(--danger);
    color: #ffffff;
    border-color: var(--danger);
  }

  .btn-danger:hover {
    background: var(--danger-hover);
    border-color: var(--danger-hover);
  }

  .btn-danger-subtle {
    background: #fff1f2;
    color: #be123c;
    border-color: #fecdd3;
  }

  .btn-danger-subtle:hover {
    background: #ffe4e6;
    border-color: #fda4af;
  }

  .btn-outline {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    color: #334155;
  }

  .btn-outline:hover {
    background: #f8fafc;
    border-color: #94a3b8;
    color: #0f172a;
  }

  .btn-sm {
    padding: 5px 10px;
    font-size: 11.5px;
    border-radius: var(--radius-sm);
  }

  /* Inventory Table */
  .table-container {
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    overflow-x: auto;
    background: #ffffff;
    box-shadow: var(--shadow-sm);
    max-height: 520px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    font-size: 12.5px;
  }

  th {
    background: #f8fafc;
    color: var(--slate-600);
    font-weight: 700;
    padding: 11px 14px;
    border-bottom: 1px solid var(--slate-300);
    position: sticky;
    top: 0;
    z-index: 10;
    white-space: nowrap;
    text-transform: uppercase;
    font-size: 10.5px;
    letter-spacing: 0.04em;
  }

  td {
    padding: 11px 14px;
    border-bottom: 1px solid #f1f5f9;
    color: var(--slate-800);
    vertical-align: middle;
  }

  tr:hover td {
    background-color: #f8fafc;
  }

  tr.zero-stock-row td {
    background-color: #fcfcfc;
  }

  /* Minimalist Status Badges with Dots */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2.5px 7px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }

  .dot-critical { background-color: #be123c; }
  .dot-near { background-color: #b45309; }
  .dot-safe { background-color: #047857; }
  .dot-expired { background-color: #64748b; }
  .dot-neutral { background-color: #94a3b8; }

  .badge-danger, .badge-critical {
    background: #fff1f2;
    color: #be123c;
    border: 1px solid #fecdd3;
  }

  .badge-warning, .badge-near {
    background: #fffbeb;
    color: #b45309;
    border: 1px solid #fde68a;
  }

  .badge-success, .badge-safe {
    background: #f0fdf4;
    color: #047857;
    border: 1px solid #bbf7d0;
  }

  .badge-neutral {
    background: #f8fafc;
    color: #64748b;
    border: 1px solid #cbd5e1;
  }

  .badge-donation {
    background: #f1f5f9;
    color: #334155;
    border: 1px solid #cbd5e1;
  }

  .badge-brand {
    background: #f8fafc;
    color: #1e293b;
    border: 1px solid #cbd5e1;
    font-weight: 600;
  }

  .badge-uom {
    background: #f0f9ff;
    color: #0369a1;
    border: 1px solid #bae6fd;
    font-weight: 600;
    text-transform: capitalize;
  }

  .exp-preview-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 4px;
    line-height: 1.3;
    animation: fadeIn 0.15s ease-in-out;
  }

  .exp-preview-critical {
    background: #fff1f2;
    color: #be123c;
    border: 1px solid #fecdd3;
  }

  .exp-preview-near {
    background: #fffbeb;
    color: #b45309;
    border: 1px solid #fde68a;
  }

  .exp-preview-safe {
    background: #f0fdf4;
    color: #047857;
    border: 1px solid #bbf7d0;
  }

  .exp-preview-expired {
    background: #f8fafc;
    color: #64748b;
    border: 1px solid #cbd5e1;
  }

  /* Custom Month-Year Picker Component */
  .month-picker-input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .month-picker-input {
    cursor: pointer;
    background-color: #ffffff !important;
    padding-right: 38px;
    font-weight: 600;
    color: var(--slate-800);
  }

  .month-picker-btn {
    position: absolute;
    right: 8px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 16px;
    padding: 4px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    user-select: none;
  }

  .month-picker-btn:hover {
    background: #f1f5f9;
  }

  .month-picker-popup {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 0;
    width: 295px;
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.18), 0 8px 10px -6px rgba(0, 0, 0, 0.12);
    padding: 12px;
    z-index: 1050;
    animation: fadeIn 0.15s ease-out;
  }

  .month-picker-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .picker-nav-btn {
    background: #f8fafc;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 4px 10px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    color: var(--slate-700);
    transition: all 0.15s;
  }

  .picker-nav-btn:hover {
    background: #e2e8f0;
    color: var(--slate-900);
  }

  .picker-year-select-wrap {
    flex: 1;
    text-align: center;
    margin: 0 6px;
  }

  .picker-year-select {
    width: 100%;
    text-align: center;
    padding: 5px 8px;
    font-size: 14px;
    font-weight: 800;
    color: var(--slate-900);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    background: #ffffff;
    cursor: pointer;
  }

  .picker-year-select:focus {
    border-color: var(--primary);
    outline: none;
  }

  .picker-quick-years {
    display: flex;
    gap: 4px;
    margin-bottom: 10px;
    justify-content: space-between;
  }

  .picker-quick-year-btn {
    flex: 1;
    background: #f1f5f9;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: 5px 2px;
    font-size: 11px;
    font-weight: 700;
    color: var(--slate-600);
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  .picker-quick-year-btn:hover {
    background: #e2e8f0;
    color: var(--slate-900);
  }

  .picker-quick-year-btn.active {
    background: var(--primary);
    color: #ffffff;
    border-color: var(--primary);
  }

  .month-picker-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }

  .picker-month-btn {
    background: #f8fafc;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 9px 4px;
    font-size: 13px;
    font-weight: 700;
    color: var(--slate-700);
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  .picker-month-btn:hover {
    background: #e0f2fe;
    color: var(--primary);
    border-color: #bae6fd;
    transform: translateY(-1px);
  }

  .picker-month-btn.selected {
    background: #0f172a;
    color: #ffffff;
    border-color: #0f172a;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.25);
  }

  .qty-display {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    font-weight: 600;
    font-size: 13.5px;
    color: var(--slate-900);
  }

  .qty-zero {
    color: var(--danger);
    font-weight: 700;
  }

  .price-display {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    font-weight: 600;
    color: var(--slate-800);
    font-size: 13px;
  }

  .cost-callout {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: var(--radius-md);
    padding: 10px 14px;
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* Forms & Card Layouts */
  .form-card {
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 24px;
    max-width: 650px;
    margin: 0 auto;
    box-shadow: var(--shadow-sm);
  }

  .form-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--slate-900);
  }

  .form-desc {
    font-size: 12px;
    color: var(--slate-500);
    margin-bottom: 20px;
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--slate-700);
    margin-bottom: 6px;
  }

  .form-input,
  .form-textarea,
  .form-select,
  .form-select-full {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    font-size: 13px;
    outline: none;
    transition: all 0.2s;
    background-color: #ffffff;
    color: var(--slate-800);
  }

  .form-input:focus,
  .form-textarea:focus,
  .form-select:focus,
  .form-select-full:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  /* Grid Layouts */
  .form-grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    align-items: start;
  }

  @media (max-width: 768px) {
    .form-grid-2 {
      grid-template-columns: 1fr;
      gap: 12px;
    }
  }

  .label-hint {
    font-size: 11px;
    color: var(--slate-400);
    font-weight: normal;
    margin-left: 4px;
  }

  /* Sync Notice Banner */
  .sync-banner {
    background: linear-gradient(135deg, #eff6ff 0%, #f0fdf4 100%);
    border: 1px solid #bfdbfe;
    border-radius: var(--radius-md);
    padding: 10px 14px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    color: #1e3a8a;
    box-shadow: var(--shadow-sm);
  }

  .sync-banner-icon {
    font-size: 16px;
    flex-shrink: 0;
  }

  .sync-banner-text {
    line-height: 1.45;
  }

  .btn-ghost {
    background: transparent;
    border: 1px solid #cbd5e1;
    color: var(--slate-600);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn-ghost:hover {
    background: #ffffff;
    border-color: var(--slate-400);
    color: var(--slate-900);
  }

  /* Enhanced Searchable Combobox & Floating Dropdowns */
  .combobox-wrapper {
    position: relative;
    width: 100%;
  }

  .combobox-input {
    padding-right: 58px !important;
    font-weight: 500;
  }

  .combobox-actions {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .combobox-btn {
    background: transparent;
    border: none;
    color: var(--slate-400);
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-sm);
    transition: all 0.15s ease;
  }

  .combobox-btn:hover {
    background: var(--slate-100);
    color: var(--slate-700);
  }

  .combobox-btn.btn-clear:hover {
    background: var(--danger-light);
    color: var(--danger);
  }

  .combobox-btn.btn-toggle:hover {
    background: var(--primary-light);
    color: var(--primary);
  }

  /* Floating Dropdown Menu */
  .combobox-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    max-height: 280px;
    overflow-y: auto;
    z-index: 100;
    animation: dropdownPop 0.15s ease-out;
  }

  @keyframes dropdownPop {
    from {
      opacity: 0;
      transform: translateY(-4px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

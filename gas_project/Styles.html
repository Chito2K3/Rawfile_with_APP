<style>
  :root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-light: #eff6ff;
    --danger: #dc2626;
    --danger-light: #fef2f2;
    --warning: #d97706;
    --warning-light: #fffbeb;
    --success: #16a34a;
    --success-light: #f0fdf4;
    --purple: #7c3aed;
    --purple-light: #f5f3ff;
    --slate-900: #0f172a;
    --slate-800: #1e293b;
    --slate-700: #334155;
    --slate-600: #475569;
    --slate-500: #64748b;
    --slate-400: #94a3b8;
    --slate-200: #e2e8f0;
    --slate-100: #f1f5f9;
    --slate-50: #f8fafc;
    --border-color: #e2e8f0;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: var(--font-family);
    background-color: #f8fafc;
    color: var(--slate-800);
    line-height: 1.5;
    font-size: 14px;
    padding: 16px;
    -webkit-font-smoothing: antialiased;
  }

  /* Main Container */
  .app-container {
    max-width: 1200px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border-color);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 90vh;
  }

  /* Header */
  .app-header {
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    color: #ffffff;
    padding: 20px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 3px solid #3b82f6;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header-icon {
    font-size: 28px;
    background: rgba(255, 255, 255, 0.1);
    padding: 8px;
    border-radius: var(--radius-md);
  }

  .header-institution {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #60a5fa;
    margin-bottom: 2px;
  }

  .header-title {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.01em;
    color: #ffffff;
  }

  .header-subtitle {
    font-size: 12px;
    color: var(--slate-400);
    font-weight: 400;
  }

  /* Stat Counters Banner */
  .stats-banner {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    padding: 16px 24px;
    background: #f1f5f9;
    border-bottom: 1px solid var(--border-color);
  }

  .stat-card {
    background: #ffffff;
    padding: 12px 16px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s ease;
  }
  .stat-card:hover {
    transform: translateY(-2px);
  }

  .stat-icon {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .stat-card.total .stat-icon { background: var(--primary-light); color: var(--primary); }
  .stat-card.critical .stat-icon { background: var(--danger-light); color: var(--danger); }
  .stat-card.near .stat-icon { background: var(--warning-light); color: var(--warning); }
  .stat-card.zero .stat-icon { background: var(--purple-light); color: var(--purple); }

  .stat-value {
    font-size: 18px;
    font-weight: 700;
    color: var(--slate-900);
    line-height: 1.2;
  }
  .stat-label {
    font-size: 11px;
    color: var(--slate-500);
    text-transform: uppercase;
    font-weight: 600;
  }

  /* Tab Navigation */
  .tab-nav {
    display: flex;
    background: #ffffff;
    border-bottom: 1px solid var(--border-color);
    padding: 0 24px;
    overflow-x: auto;
  }

  .tab-btn {
    padding: 14px 20px;
    border: none;
    background: none;
    font-size: 13px;
    font-weight: 600;
    color: var(--slate-600);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 3px solid transparent;
    transition: all 0.2s ease;
    white-space: nowrap;
  }

  .tab-btn:hover {
    color: var(--primary);
    background: var(--slate-50);
  }

  .tab-btn.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
    background: var(--primary-light);
  }

  /* Main Tab Content */
  .tab-content-area {
    padding: 24px;
    flex: 1;
  }

  .tab-pane {
    display: none;
  }
  .tab-pane.active {
    display: block;
    animation: fadeIn 0.2s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Control Bar (Search & Filter) */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
    align-items: center;
  }

  .search-box {
    flex: 1;
    min-width: 250px;
    position: relative;
  }

  .search-input {
    width: 100%;
    padding: 10px 14px 10px 38px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    font-size: 13px;
    outline: none;
    transition: all 0.2s;
  }
  .search-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }
  .search-icon-inside {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--slate-400);
    font-size: 14px;
  }

  .filter-select {
    padding: 10px 14px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    font-size: 13px;
    background: #ffffff;
    color: var(--slate-700);
    outline: none;
    cursor: pointer;
  }
  .filter-select:focus {
    border-color: var(--primary);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 16px;
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.2s ease;
  }
  .btn:active {
    transform: scale(0.98);
  }
  .btn-primary {
    background: var(--primary);
    color: #ffffff;
  }
  .btn-primary:hover {
    background: var(--primary-hover);
  }
  .btn-danger {
    background: var(--danger);
    color: #ffffff;
  }
  .btn-danger:hover {
    background: #b91c1c;
  }
  .btn-outline {
    background: #ffffff;
    border: 1px solid var(--border-color);
    color: var(--slate-700);
  }
  .btn-outline:hover {
    background: var(--slate-100);
  }
  .btn-sm {
    padding: 6px 10px;
    font-size: 12px;
    border-radius: var(--radius-sm);
  }

  /* Inventory Table */
  .table-container {
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    overflow-x: auto;
    background: #ffffff;
    box-shadow: var(--shadow-sm);
    max-height: 520px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    font-size: 13px;
  }

  th {
    background: #f8fafc;
    color: var(--slate-600);
    font-weight: 700;
    padding: 12px 14px;
    border-bottom: 2px solid var(--border-color);
    position: sticky;
    top: 0;
    z-index: 10;
    white-space: nowrap;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.03em;
  }

  td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border-color);
    color: var(--slate-800);
    vertical-align: middle;
  }

  tr:hover td {
    background-color: #f1f5f9;
  }

  tr.zero-stock-row td {
    background-color: #faf5ff;
  }

  /* Status Badges */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 9999px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .badge-danger {
    background: var(--danger-light);
    color: var(--danger);
    border: 1px solid #fecaca;
  }
  .badge-warning {
    background: var(--warning-light);
    color: var(--warning);
    border: 1px solid #fde68a;
  }
  .badge-success {
    background: var(--success-light);
    color: var(--success);
    border: 1px solid #bbf7d0;
  }
  .badge-neutral {
    background: var(--slate-100);
    color: var(--slate-600);
    border: 1px solid var(--slate-200);
  }
  .badge-donation {
    background: var(--purple-light);
    color: var(--purple);
    border: 1px solid #ddd6fe;
  }
  .badge-brand {
    background: #eef2ff;
    color: #4338ca;
    border: 1px solid #c7d2fe;
    font-weight: 700;
  }

  .qty-display {
    font-family: monospace;
    font-weight: 700;
    font-size: 14px;
  }
  .qty-zero {
    color: var(--danger);
    font-weight: 800;
  }
  .price-display {
    font-family: monospace;
    font-weight: 700;
    color: #047857;
    font-size: 13px;
  }
  .cost-callout {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: var(--radius-md);
    padding: 10px 14px;
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* Forms & Card Layouts */
  .form-card {
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 24px;
    max-width: 650px;
    margin: 0 auto;
    box-shadow: var(--shadow-sm);
  }

  .form-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--slate-900);
  }

  .form-desc {
    font-size: 12px;
    color: var(--slate-500);
    margin-bottom: 20px;
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--slate-700);
    margin-bottom: 6px;
  }

  .form-input, .form-textarea, .form-select-full {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    font-size: 13px;
    outline: none;
    transition: all 0.2s;
  }
  .form-input:focus, .form-textarea:focus, .form-select-full:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  /* Grid Layouts */
  .form-grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    align-items: start;
  }
  @media (max-width: 768px) {
    .form-grid-2 {
      grid-template-columns: 1fr;
      gap: 12px;
    }
  }

  .label-hint {
    font-size: 11px;
    color: var(--slate-400);
    font-weight: normal;
    margin-left: 4px;
  }

  /* Sync Notice Banner */
  .sync-banner {
    background: linear-gradient(135deg, #eff6ff 0%, #f0fdf4 100%);
    border: 1px solid #bfdbfe;
    border-radius: var(--radius-md);
    padding: 10px 14px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    color: #1e3a8a;
    box-shadow: var(--shadow-sm);
  }
  .sync-banner-icon {
    font-size: 16px;
    flex-shrink: 0;
  }
  .sync-banner-text {
    line-height: 1.45;
  }
  .btn-ghost {
    background: transparent;
    border: 1px solid #cbd5e1;
    color: var(--slate-600);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-ghost:hover {
    background: #ffffff;
    border-color: var(--slate-400);
    color: var(--slate-900);
  }

  /* Enhanced Searchable Combobox & Floating Dropdowns */
  .combobox-wrapper {
    position: relative;
    width: 100%;
  }

  .combobox-input {
    padding-right: 58px !important;
    font-weight: 500;
  }

  .combobox-actions {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .combobox-btn {
    background: transparent;
    border: none;
    color: var(--slate-400);
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-sm);
    transition: all 0.15s ease;
  }
  .combobox-btn:hover {
    background: var(--slate-100);
    color: var(--slate-700);
  }
  .combobox-btn.btn-clear:hover {
    background: var(--danger-light);
    color: var(--danger);
  }
  .combobox-btn.btn-toggle:hover {
    background: var(--primary-light);
    color: var(--primary);
  }

  /* Floating Dropdown Menu */
  .combobox-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    max-height: 280px;
    overflow-y: auto;
    z-index: 100;
    animation: dropdownPop 0.15s ease-out;
  }

  @keyframes dropdownPop {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .dropdown-header {
    position: sticky;
    top: 0;
    background: #f8fafc;
    border-bottom: 1px solid var(--border-color);
    padding: 7px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--slate-600);
    z-index: 2;
  }
  .dropdown-title {
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 10px;
    color: var(--slate-500);
  }
  .dropdown-count {
    background: var(--slate-200);
    color: var(--slate-700);
    padding: 1px 6px;
    border-radius: 10px;
    font-size: 10px;
  }

  .dropdown-list {
    display: flex;
    flex-direction: column;
  }

  .dropdown-item {
    padding: 9px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border-bottom: 1px solid #f1f5f9;
    font-size: 12.5px;
    transition: background 0.1s ease;
  }
  .dropdown-item:last-child {
    border-bottom: none;
  }
  .dropdown-item:hover, .dropdown-item.focused {
    background: #eff6ff;
    color: #1e40af;
  }

  .dropdown-item-code {
    font-family: monospace;
    font-weight: 700;
    font-size: 11.5px;
    color: #2563eb;
    background: #dbeafe;
    padding: 2px 6px;
    border-radius: 4px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .dropdown-item:hover .dropdown-item-code, .dropdown-item.focused .dropdown-item-code {
    background: #bfdbfe;
    color: #1d4ed8;
  }

  .dropdown-item-desc {
    font-weight: 500;
    color: #1e293b;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }

  .dropdown-highlight {
    background: #fef08a;
    color: #854d0e;
    font-weight: 700;
    padding: 0 1px;
    border-radius: 2px;
  }

  .dropdown-empty {
    padding: 18px 14px;
    text-align: center;
    font-size: 12px;
    color: var(--slate-500);
  }
  .dropdown-empty-hint {
    font-size: 11px;
    color: var(--slate-400);
    margin-top: 4px;
  }

  .batch-preview-box {
    background: var(--slate-50);
    border: 1px dashed var(--slate-300);
    border-radius: var(--radius-md);
    padding: 12px;
    margin-top: 8px;
    font-size: 12px;
  }
  .batch-preview-title {
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 6px;
  }

  /* Modals */
  .modal-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(2px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 16px;
  }

  .modal-card {
    background: #ffffff;
    width: 100%;
    max-width: 480px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    animation: modalPop 0.2s ease-out;
  }

  @keyframes modalPop {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  .modal-header {
    padding: 16px 20px;
    background: #f8fafc;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--slate-900);
  }
  .modal-body {
    padding: 20px;
  }
  .modal-footer {
    padding: 14px 20px;
    background: #f8fafc;
    border-top: 1px solid var(--border-color);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }

  /* Toast Notification */
  .toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .toast {
    padding: 12px 18px;
    border-radius: var(--radius-md);
    background: var(--slate-900);
    color: #ffffff;
    font-size: 13px;
    box-shadow: var(--shadow-lg);
    display: flex;
    align-items: center;
    gap: 10px;
    animation: slideUp 0.25s ease-out;
    max-width: 380px;
  }
  .toast.success { background: #065f46; border-left: 4px solid #34d399; }
  .toast.error { background: #991b1b; border-left: 4px solid #f87171; }
  .toast.info { background: #1e3a8a; border-left: 4px solid #60a5fa; }

  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* Loading Spinner */
  .spinner-overlay {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    color: var(--slate-500);
    gap: 12px;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--slate-200);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Autocomplete Suggestions */
  .autocomplete-list {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    max-height: 200px;
    overflow-y: auto;
    z-index: 50;
    box-shadow: var(--shadow-md);
  }
  .autocomplete-item {
    padding: 8px 12px;
    cursor: pointer;
    font-size: 12px;
    border-bottom: 1px solid var(--slate-100);
  }
  .autocomplete-item:hover {
    background: var(--primary-light);
    color: var(--primary);
  }
</style>

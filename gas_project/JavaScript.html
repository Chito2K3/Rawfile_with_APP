  // On DOM Ready
  document.addEventListener('DOMContentLoaded', () => {
    initTabs();
    setupComboboxEvents();
    loadInventory();
    initMonthPickers();
    const addUomEl = document.getElementById('add-uom');
    if (addUomEl) {
      addUomEl.addEventListener('change', () => {
        addUomEl.dataset.userEdited = 'true';
        onUomSelectionChange();
      });
    }
    onUomSelectionChange();
  });

  // Tab Navigation Handling
  function initTabs() {
    const tabBtns = document.querySelectorAll('.tab-btn');
    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.dataset.tab;
        switchTab(target);
      });
    });
  }

  function switchTab(tabId) {
    state.activeTab = tabId;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));

    const activeBtn = document.querySelector(`.tab-btn[data-tab="${tabId}"]`);
    const activePane = document.getElementById(tabId);
    if (activeBtn) activeBtn.classList.add('active');
    if (activePane) activePane.classList.add('active');

    if (tabId === 'tab-logs') {
      loadLogs();
    } else if (tabId === 'tab-restock') {
      filterRestockTable();
    }
  }

  // Toast Notification System
  function showToast(message, type = 'info') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    
    let icon = 'ℹ️';
    if (type === 'success') icon = '✅';
    if (type === 'error') icon = '❌';

    toast.innerHTML = `<span>${icon}</span> <div>${message}</div>`;
    container.appendChild(toast);

    setTimeout(() => {
      toast.style.opacity = '0';
      setTimeout(() => toast.remove(), 300);
    }, 4500);
  }

        .withFailureHandler(onApiError)

    } else {

  function onInventoryLoaded(response) {
    setLoading(false);
    if (!response.success) {
      showToast(response.error || "Failed to load inventory.", "error");
      return;
    }

    state.items = response.items || [];
    if (response.catalog && Array.isArray(response.catalog) && response.catalog.length > 0) {
      state.masterCatalog = response.catalog;
    } else if (!state.masterCatalog || state.masterCatalog.length === 0) {
      state.masterCatalog = DEFAULT_MOCK_DCI_CATALOG;
    }
    renderStats();
    applyFilter();
    populateCatalogDatalists();
    setupComboboxEvents();
  }

  function onApiError(err) {
    setLoading(false);
    showToast(err.message || "An error occurred with Google Apps Script.", "error");
  }

  function setLoading(isLoading) {
    state.loading = isLoading;
    const spinner = document.getElementById('loading-spinner');
    if (spinner) {
      spinner.style.display = isLoading ? 'flex' : 'none';
    }
  }

  // Calculate & Render Stats Banner
  function renderStats() {
    const totalItems = state.items.length;
    const totalUnits = state.items.reduce((sum, item) => sum + (item.qty || 0), 0);
    const critical2026 = state.items.filter(i => i.expStatus === 'CRITICAL_2026').length;
    const near2027 = state.items.filter(i => i.expStatus === 'NEAR_2027').length;
    const zeroStock = state.items.filter(i => i.isZeroStock).length;

    document.getElementById('stat-total-items').textContent = totalItems.toLocaleString();
    document.getElementById('stat-total-qty').textContent = totalUnits.toLocaleString() + ' units';
    document.getElementById('stat-2026-count').textContent = critical2026;
    document.getElementById('stat-2027-count').textContent = near2027;
    document.getElementById('stat-zero-count').textContent = zeroStock;
  }

  // Filter and Live Search Logic (Matches Code, Generic, Brand, Expiry)
  function applyFilter() {
    const query = (document.getElementById('search-input').value || '').toLowerCase().trim();
    const statusFilter = document.getElementById('filter-status').value;

    state.filteredItems = state.items.filter(item => {
      const matchQuery = !query || 
        item.itemCode.toLowerCase().includes(query) || 
        item.itemDesc.toLowerCase().includes(query) ||
        (item.brandName && item.brandName.toLowerCase().includes(query)) ||
        (item.uom && item.uom.toLowerCase().includes(query)) ||
        item.expDate.toLowerCase().includes(query);

      let matchStatus = true;
      if (statusFilter === 'CRITICAL_2026') matchStatus = item.expStatus === 'CRITICAL_2026';
      else if (statusFilter === 'NEAR_2027') matchStatus = item.expStatus === 'NEAR_2027';
      else if (statusFilter === 'SAFE') matchStatus = item.expStatus === 'SAFE';
      else if (statusFilter === 'NO_EXPIRY') matchStatus = item.expStatus === 'NO_EXPIRY';
      else if (statusFilter === 'ZERO') matchStatus = item.isZeroStock;
      else if (statusFilter === 'DONATION') matchStatus = item.isDonation;

      return matchQuery && matchStatus;
    });

    renderInventoryTable();
  }

  // Render Main Inventory Table (Option A Layout: Code | Generic | Brand | UOM | Qty | Expiry | Price | Date Out | Actions)
  function renderInventoryTable() {
    const tbody = document.getElementById('inventory-table-body');
    tbody.innerHTML = '';

    if (state.filteredItems.length === 0) {
      tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding:30px; color:#64748b;">No matching medicines found.</td></tr>`;
      return;
    }

    state.filteredItems.forEach(item => {
      const tr = document.createElement('tr');
      if (item.isZeroStock) tr.classList.add('zero-stock-row');

      let badgeHtml = '';
      if (item.expStatus === 'CRITICAL_2026') {
        badgeHtml = `<span class="badge badge-danger">🔴 2026 Risk (${item.expDate})</span>`;
      } else if (item.expStatus === 'NEAR_2027') {
        badgeHtml = `<span class="badge badge-warning">🟠 2027 Near (${item.expDate})</span>`;
      } else if (item.expStatus === 'SAFE') {
        badgeHtml = `<span class="badge badge-success">🟢 ${item.expDate}</span>`;
      } else {
        badgeHtml = `<span class="badge badge-neutral">⚪ ${item.expDate}</span>`;
      }

      const catBadge = item.isDonation 
        ? `<span class="badge badge-donation" style="margin-left:4px;">Donation</span>` 
        : '';

      const brandBadge = item.brandName 
        ? `<span class="badge badge-brand">${escapeHtml(item.brandName)}</span>`
        : `<span style="color:#94a3b8; font-style:italic;">--</span>`;

      const resolvedUom = item.uom || detectUomFromText(item.itemDesc);
      const uomDisplay = `<span class="badge badge-uom">${escapeHtml(resolvedUom)}</span>`;

      const qtyDisplay = item.isZeroStock 
        ? `<span class="qty-zero">0 (Out of Stock)</span>` 
        : `<span class="qty-display">${item.qty.toLocaleString()}</span>`;

      const priceDisplay = (typeof item.acquisitionPrice === 'number' && item.acquisitionPrice > 0)
        ? `<span class="price-display">₱${item.acquisitionPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>`
        : `<span style="color:#94a3b8;">₱0.00</span>`;

      const dateOutDisplay = item.dateOut 
        ? `<span style="font-weight:600; color:#475569; font-size:12px;">${escapeHtml(item.dateOut)}</span>`
        : `<span style="color:#94a3b8; font-style:italic; font-size:12px;">--</span>`;

      tr.innerHTML = `
        <td style="font-family:monospace; font-weight:600; color:#1e293b;">${escapeHtml(item.itemCode)}</td>
        <td>
          <div style="font-weight:600;">${escapeHtml(item.itemDesc)} ${catBadge}</div>
          <div style="font-size:11px; color:#64748b;">Row ${item.rowIndex} in Sheet</div>
        </td>
        <td>${brandBadge}</td>
        <td style="text-align:center;">${uomDisplay}</td>
        <td style="text-align:right;">${qtyDisplay}</td>
        <td>${badgeHtml}</td>
        <td style="text-align:right;">${priceDisplay}</td>
        <td style="text-align:center;">${dateOutDisplay}</td>
        <td style="text-align:center;">
          <button class="btn btn-sm btn-danger" onclick="openStockOutModal(${item.rowIndex})" ${item.isZeroStock ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''} title="Deduct / Dispense Quantity">
            ➖ Out
          </button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  // --- STOCK OUT MODAL ACTIONS (BRAND & DATE OUT DEDUCTION) ---
  function openStockOutModal(rowIndex) {
    const item = state.items.find(i => i.rowIndex === rowIndex);
    if (!item) return;

    state.selectedRow = item;
    document.getElementById('so-code').textContent = item.itemCode;
    document.getElementById('so-desc').textContent = item.itemDesc;
    
    const brandEl = document.getElementById('so-brand-badge');
    brandEl.textContent = item.brandName || 'Brand Batch';

    const resolvedUom = item.uom || detectUomFromText(item.itemDesc);
    const uomBadgeEl = document.getElementById('so-uom-badge');
    if (uomBadgeEl) uomBadgeEl.textContent = resolvedUom;

    const uomLabelEl = document.getElementById('so-uom-label');
    if (uomLabelEl) uomLabelEl.textContent = resolvedUom + 's';
    
    document.getElementById('so-exp').textContent = item.expDate;

  function formatIsoMonthToMmmYy(val) {
    if (!val) return '';
    const s = String(val).trim();
    // If format is YYYY-MM (e.g. 2028-12)
    const mIso = s.match(/^(\d{4})-(\d{1,2})$/);
    if (mIso) {
      const yr = parseInt(mIso[1], 10);
      const mo = parseInt(mIso[2], 10);
      if (mo >= 1 && mo <= 12) {
        return `${MONTH_NAMES_SHORT[mo - 1]}-${String(yr).slice(-2)}`;
      }
    }
    // If format is already MMM-YY (e.g. Dec-28)
    const mShort = s.match(/^([A-Za-z]{3})-(\d{2})$/);
    if (mShort) {
      const mStr = mShort[1].charAt(0).toUpperCase() + mShort[1].slice(1).toLowerCase();
      return `${mStr}-${mShort[2]}`;
    }
    return s;
  }

  function formatMmmYyToIsoMonth(val) {
    if (!val) return '';
    const s = String(val).trim();
    if (/^\d{4}-\d{2}$/.test(s)) return s;

    const mShort = s.match(/^([A-Za-z]{3})-(\d{2})$/);
    if (mShort) {
      const mLower = mShort[1].toLowerCase();
      const mIdx = MONTH_NAMES_SHORT.findIndex(m => m.toLowerCase() === mLower);
      if (mIdx !== -1) {
        const yr = 2000 + parseInt(mShort[2], 10);
        const mm = String(mIdx + 1).padStart(2, '0');
        return `${yr}-${mm}`;
      }
    }
    return '';
  }

  function getExpiryDateDetails(val) {
    if (!val) return null;
    const s = String(val).trim();
    let yr = null;
    let mo = null; // 1-12

    const mIso = s.match(/^(\d{4})-(\d{1,2})/);
    if (mIso) {
      yr = parseInt(mIso[1], 10);
      mo = parseInt(mIso[2], 10);
    } else {
      const mShort = s.match(/^([A-Za-z]{3})-(\d{2})/);
      if (mShort) {
        yr = 2000 + parseInt(mShort[2], 10);
        const mIdx = MONTH_NAMES_SHORT.findIndex(m => m.toLowerCase() === mShort[1].toLowerCase());
        if (mIdx !== -1) mo = mIdx + 1;
      }
    }

    if (!yr || !mo || mo < 1 || mo > 12) return null;

    const lastDay = new Date(yr, mo, 0).getDate();
    const mShortName = MONTH_NAMES_SHORT[mo - 1];
    const mmmYy = `${mShortName}-${String(yr).slice(-2)}`;
    const isoMonth = `${yr}-${String(mo).padStart(2, '0')}`;
    const fullDateStr = `${mShortName} ${lastDay}, ${yr}`;

    let status = 'SAFE';
    let statusClass = 'exp-preview-safe';
    let icon = '🟢';
    let statusLabel = 'Safe Stock';

    if (yr < 2026) {
      status = 'EXPIRED';
      statusClass = 'exp-preview-expired';
      icon = '⚠️';
      statusLabel = 'Expired Batch';
    } else if (yr === 2026) {
      status = 'CRITICAL_2026';
      statusClass = 'exp-preview-critical';
      icon = '🔴';
      statusLabel = '2026 Critical Risk';
    } else if (yr === 2027) {
      status = 'NEAR_2027';
      statusClass = 'exp-preview-near';
      icon = '🟠';
      statusLabel = '2027 Near-Term';
    }

    return {
      isoMonth,
      mmmYy,
      year: yr,
      month: mo,
      lastDay,
      fullDateStr,
      status,
      statusClass,
      icon,
      statusLabel
    };
  }

  function onExpiryChange(type) {
    const inputId = `${type}-exp`;
    const badgeId = `${type}-exp-badge`;
    const input = document.getElementById(inputId);
    const badge = document.getElementById(badgeId);

    badge.innerHTML = `${details.icon} <strong>${details.mmmYy}</strong> • Valid thru ${details.fullDateStr} (${details.statusLabel})`;
    badge.style.display = 'inline-flex';
  }

  // --- ADD MEDICINE / NEW BATCH SMART CHECK ---
  // --- UOM SELECTION & AUTO-DETECTION ---
  function detectUomFromText(text) {
    if (!text) return 'Tablet';
    const s = String(text).toUpperCase();
    if (/\b(CAPSULE|CAPSULES|CAP|CAPS)\b/.test(s)) return 'Capsule';
    if (/\b(VIAL|VIALS)\b/.test(s)) return 'Vial';
    if (/\b(AMPULE|AMPULES|AMP|AMPS)\b/.test(s)) return 'Ampule';
    if (/\b(NEBULE|NEBULES|RESPIRATORY SOLUTION|FOR NEBULIZATION)\b/.test(s)) return 'Nebule';
    if (/\b(PRE-FILLED SYRINGE|PREFILLED SYRINGE|PRE-FILED SYRINGE|SYRINGE)\b/.test(s)) return 'Syringe';
    if (/\b(SACHET|SACHETS)\b/.test(s)) return 'Sachet';
    if (/\b(TUBE|TUBES|CREAM|OINTMENT|GEL)\b/.test(s)) return 'Tube';
    if (/\b(BOTTLE|BOTTLES|SUSPENSION|SYRUP|DROPS|SOLN|SOLUTION|ELIXIR|DPI|MDI)\b/.test(s)) return 'Bottle';
    return 'Tablet';
  }

  function getMockExpiryComparableScore(val) {
    if (!val) return 999999;
    const s = String(val).trim();
    if (!s || s.toUpperCase() === 'NO EXPIRY') return 999999;
    const monthMap = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12 };
    const mShort = s.match(/^([A-Za-z]{3})-(\d{2})$/);
    if (mShort) {
      return (2000 + parseInt(mShort[2], 10)) * 100 + (monthMap[mShort[1].toLowerCase()] || 0);
    }
    const mLong = s.match(/^([A-Za-z]{3})-(\d{4})$/);
    if (mLong) {
      return parseInt(mLong[2], 10) * 100 + (monthMap[mLong[1].toLowerCase()] || 0);
    }
    const mIso = s.match(/^(\d{4})-(\d{1,2})/);
    if (mIso) {
      return parseInt(mIso[1], 10) * 100 + parseInt(mIso[2], 10);
    }
    const d = new Date(s);
    if (!isNaN(d.getTime())) {
      return d.getFullYear() * 100 + (d.getMonth() + 1);
    }
    return 999999;
  }

        })
        .addNewMedicineOrBatch(payload);
    } else {
      setLoading(false);
      const newScore = getMockExpiryComparableScore(exp);
      const existingIndices = [];
      state.items.forEach((item, idx) => {
        if (item.itemCode.toUpperCase() === code.toUpperCase()) {
          existingIndices.push(idx);
        }
      });

      const yrMatch = exp.match(/\d{2,4}/);
      const parsedYr = yrMatch ? (yrMatch[0].length === 2 ? 2000 + parseInt(yrMatch[0], 10) : parseInt(yrMatch[0], 10)) : 2028;
      let expStatus = 'SAFE';
      if (parsedYr === 2026) expStatus = 'CRITICAL_2026';
      else if (parsedYr === 2027) expStatus = 'NEAR_2027';

      const newItem = {
        rowIndex: state.items.length + 2,
        itemCode: code,
        itemDesc: desc,
        brandName: brand,
        uom: uom,
        qty: qty,
        expDate: exp,
        expYear: parsedYr,
        expStatus: expStatus,
        acquisitionPrice: price,
        dateOut: '',
        isDonation: code.startsWith('DMDON') || code.startsWith('DMCSP'),
        isZeroStock: qty <= 0
      };

      let placementNotice = '';
      if (existingIndices.length > 0) {
        let insertPos = -1;
        for (const idx of existingIndices) {
          const itemScore = getMockExpiryComparableScore(state.items[idx].expDate);
          if (itemScore > newScore) {
            insertPos = idx;
            break;
          }
        }
        if (insertPos !== -1) {
          const targetExp = state.items[insertPos].expDate;
          state.items.splice(insertPos, 0, newItem);
          placementNotice = `FEFO Priority (Placed above later batch [${targetExp}])`;
        } else {
          const lastIdx = existingIndices[existingIndices.length - 1];
          state.items.splice(lastIdx + 1, 0, newItem);
          placementNotice = `FEFO Placed (Placed below existing batches)`;
        }
        state.items.forEach((it, i) => it.rowIndex = i + 2);
      } else {
        state.items.push(newItem);
        placementNotice = 'New medicine entry';
      }

      showToast(`[FEFO Auto-Placed] Saved ${code} - ${desc} [${brand}] (${uom}, ${exp}) — ${placementNotice}`, "success");
      resetDciSelection();
      document.getElementById('add-brand').value = '';
      document.getElementById('add-qty').value = '';
      document.getElementById('add-exp').value = '';
      document.getElementById('add-exp-display').value = '';
      const addExpBadge = document.getElementById('add-exp-badge');
      if (addExpBadge) addExpBadge.style.display = 'none';
      document.getElementById('add-price').value = '';
      const uomEl = document.getElementById('add-uom');
      if (uomEl) {
        uomEl.value = 'Tablet';
        uomEl.dataset.userEdited = 'false';
        onUomSelectionChange();
      }
      document.getElementById('add-batch-preview').style.display = 'none';
      switchTab('tab-inventory');
      renderStats();
      applyFilter();
    }
  }

  // --- MASTER DCI FORMULARY & SEARCHABLE COMBOBOX SYSTEM ---
  function normalizeMedText(str) {
    return String(str || '')
      .toUpperCase()
      .replace(/[\(\)\[\],.\-\/\\]/g, ' ') // treat brackets, periods, slashes, dashes as space
      .replace(/\s+/g, ' ')
      .trim();
  }

  let comboboxEventsInitialized = false;
  function setupComboboxEvents() {
    if (comboboxEventsInitialized) return;
    const codeInput = document.getElementById('add-code');
    const descInput = document.getElementById('add-desc');
    if (!codeInput || !descInput) return;
    comboboxEventsInitialized = true;

    // Code input listeners
    codeInput.oninput = handleCodeInput;
    codeInput.onchange = handleCodeInput;
    codeInput.onfocus = () => {
      openDropdown('code');
      renderDropdownItems('code', codeInput.value.trim());
    };
    codeInput.onkeydown = (e) => handleComboboxKeydown(e, 'code');
    codeInput.onblur = () => handleComboboxBlur('code');

    // Desc input listeners
    descInput.oninput = handleDescInput;
    descInput.onchange = handleDescInput;
    descInput.onfocus = () => {
      openDropdown('desc');
      renderDropdownItems('desc', descInput.value.trim());
    };
    descInput.onkeydown = (e) => handleComboboxKeydown(e, 'desc');
    descInput.onblur = () => handleComboboxBlur('desc');

    // Global outside click listener to close dropdowns
    document.addEventListener('click', (e) => {
      const wrapperCode = document.getElementById('combobox-code-wrapper');
      const wrapperDesc = document.getElementById('combobox-desc-wrapper');
      const inCode = wrapperCode && wrapperCode.contains(e.target);
      const inDesc = wrapperDesc && wrapperDesc.contains(e.target);

      if (!inCode && !inDesc) {
        closeAllDropdowns();
      }
    });
  }

  function handleComboboxBlur(type) {
    // Slight timeout allows click on dropdown item to fire before blur auto-resolves or closes
    setTimeout(() => {
      if (type === 'desc') {
        autoResolveDescToCode();
      } else if (type === 'code') {
        autoResolveCodeToDesc();
      }
      if (state.activeDropdown === type) {
        closeAllDropdowns();
      }
    }, 220);
  }

  function findCatalogMatches(type, query) {
    const catalog = state.masterCatalog || [];
    const qRaw = (query || '').trim();
    if (!qRaw) return catalog;

    const qLower = qRaw.toLowerCase();
    const qNorm = normalizeMedText(qRaw);
    const qWords = qNorm.split(' ').filter(w => w.length > 0);

    return catalog.filter(item => {
      const c = (item.code || '').toLowerCase();
      const d = (item.desc || '').toLowerCase();

      // Direct substring match
      if (c.includes(qLower) || d.includes(qLower)) return true;

      // Word-based match (e.g. user typed "SODIUM 0.9%" or "PARACETAMOL 500")
      if (qWords.length > 1) {
        const dNorm = normalizeMedText(item.desc);
        const allWordsMatch = qWords.every(word => dNorm.includes(word) || (item.code || '').toUpperCase().includes(word));
        if (allWordsMatch) return true;
      }

      return false;
    }).sort((a, b) => {
      const aCodeExact = a.code.toUpperCase() === qRaw.toUpperCase();
      const bCodeExact = b.code.toUpperCase() === qRaw.toUpperCase();
      if (aCodeExact && !bCodeExact) return -1;
      if (!aCodeExact && bCodeExact) return 1;

      const aDescExact = normalizeMedText(a.desc) === qNorm;
      const bDescExact = normalizeMedText(b.desc) === qNorm;
      if (aDescExact && !bDescExact) return -1;
      if (!aDescExact && bDescExact) return 1;

      if (type === 'code') {
        const aCodeStarts = a.code.toLowerCase().startsWith(qLower);
        const bCodeStarts = b.code.toLowerCase().startsWith(qLower);
        if (aCodeStarts && !bCodeStarts) return -1;
        if (!aCodeStarts && bCodeStarts) return 1;
      } else {
        const aDescStarts = a.desc.toLowerCase().startsWith(qLower);
        const bDescStarts = b.desc.toLowerCase().startsWith(qLower);
        if (aDescStarts && !bDescStarts) return -1;
        if (!aDescStarts && bDescStarts) return 1;
      }

      return a.desc.localeCompare(b.desc);
    });
  }

  function handleCodeInput(e) {
    const codeInput = document.getElementById('add-code');
    const descInput = document.getElementById('add-desc');
    const q = codeInput.value.trim();
    updateClearBtn('add-code', q);

    if (!q) {
      // User emptied the DCI Code field via Backspace/Delete
      hideMatchHint('code');
      closeAllDropdowns();
      const previewBox = document.getElementById('add-batch-preview');
      if (previewBox) previewBox.style.display = 'none';
      return;
    }

    renderDropdownItems('code', q);
    openDropdown('code');

    // Bi-directional Auto-Sync: Exact or match on DCI Code immediately sets Generic Description
    if (state.masterCatalog && state.masterCatalog.length > 0) {
      const match = state.masterCatalog.find(item => item.code.toUpperCase() === q.toUpperCase());
      if (match && match.desc) {
        if (descInput.value !== match.desc) {
          descInput.value = match.desc;
          updateClearBtn('add-desc', match.desc);
          flashElement(descInput);
        }
        hideMatchHint('code');
      } else {
        const matches = findCatalogMatches('code', q);
        if (matches.length > 0) {
          showMatchHint('code', matches[0].code, matches[0].desc);
        } else {
          hideMatchHint('code');
        }
      }
    } else {
      hideMatchHint('code');
    }

    onAddCodeOrDescChange();
  }

  function handleDescInput(e) {
    const codeInput = document.getElementById('add-code');
    const descInput = document.getElementById('add-desc');
    const q = descInput.value.trim();
    updateClearBtn('add-desc', q);

    if (!q) {
      // User emptied the Generic Description field via Backspace/Delete
      hideMatchHint('desc');
      closeAllDropdowns();
      if (codeInput) {
        codeInput.value = '';
        updateClearBtn('add-code', '');
        hideMatchHint('code');
      }
      const previewBox = document.getElementById('add-batch-preview');
      if (previewBox) previewBox.style.display = 'none';
      return;
    }

    renderDropdownItems('desc', q);
    openDropdown('desc');

    // Bi-directional Auto-Sync: When typing generic description
    if (state.masterCatalog && state.masterCatalog.length > 0) {
      const qNorm = normalizeMedText(q);
      const matches = findCatalogMatches('desc', q);

      // Check for exact full match or normalized match
      const exactMatch = matches.find(item => 
        item.desc.toUpperCase() === q.toUpperCase() || 
        normalizeMedText(item.desc) === qNorm
      );

      if (exactMatch && exactMatch.code) {
        if (codeInput.value.toUpperCase() !== exactMatch.code.toUpperCase()) {
          codeInput.value = exactMatch.code;
          updateClearBtn('add-code', exactMatch.code);
          flashElement(codeInput);
          onAddCodeOrDescChange();
        }
        hideMatchHint('desc');
      } else {
        // While user is deleting or typing a partial name that does not match an exact item,
        // clear the previously locked DCI code so it does not resurrect the old medicine!
        if (codeInput && codeInput.value) {
          codeInput.value = '';
          updateClearBtn('add-code', '');
          const previewBox = document.getElementById('add-batch-preview');
          if (previewBox) previewBox.style.display = 'none';
        }
        if (matches.length > 0) {
          showMatchHint('desc', matches[0].code, matches[0].desc);
        } else {
          hideMatchHint('desc');
        }
      }
    } else {
      hideMatchHint('desc');
    }

    onAddCodeOrDescChange();
  }

  function autoResolveDescToCode() {
    const codeInput = document.getElementById('add-code');
    const descInput = document.getElementById('add-desc');
    if (!descInput) return;
    const q = descInput.value.trim();
    if (!q) return;

    // If DCI code already filled, nothing needed
    if (codeInput && codeInput.value.trim()) return;

    // Only auto-resolve on blur if there is an exact or normalized full match!
    const qNorm = normalizeMedText(q);
    const catalog = state.masterCatalog || [];
    const exactMatch = catalog.find(item => 
      item.desc.toUpperCase() === q.toUpperCase() || 
      normalizeMedText(item.desc) === qNorm
    );

    if (exactMatch) {
      selectDciItem(exactMatch.code, exactMatch.desc);
    }
  }

  function autoResolveCodeToDesc() {
    const codeInput = document.getElementById('add-code');
    const descInput = document.getElementById('add-desc');
    if (!codeInput) return;
    const q = codeInput.value.trim();
    if (!q) return;

    if (descInput && descInput.value.trim()) return;

    const catalog = state.masterCatalog || [];
    const exactMatch = catalog.find(item => item.code.toUpperCase() === q.toUpperCase());
    if (exactMatch) {
      selectDciItem(exactMatch.code, exactMatch.desc);
    }
  }

    if (!el) return;
    el.classList.remove('input-highlight-flash');
    void el.offsetWidth; // trigger reflow
    el.classList.add('input-highlight-flash');
    setTimeout(() => el.classList.remove('input-highlight-flash'), 1200);

  function toggleComboboxDropdown(type, event) {
    if (event) {
      event.preventDefault();
      event.stopPropagation();
    }

    const btn = document.getElementById(inputId === 'add-code' ? 'btn-clear-code' : 'btn-clear-desc');
    if (btn) {

  function renderDropdownItems(type, query) {
    const listEl = document.getElementById(`list-${type}`);
    const countEl = document.getElementById(`count-${type}-matches`);
    if (!listEl) return;

    const matches = findCatalogMatches(type, query);
    const qLower = (query || '').toLowerCase().trim();

    if (countEl) {
      countEl.textContent = `${matches.length} item${matches.length !== 1 ? 's' : ''}`;
    }

    const codeVal = document.getElementById('add-code')?.value.trim() || (type === 'code' ? (query || '') : '');
    const descVal = document.getElementById('add-desc')?.value.trim() || (type === 'desc' ? (query || '') : '');
    const typedSafe = escapeHtml((query || '').trim());

    if (matches.length === 0) {
      listEl.innerHTML = `
        <div class="dropdown-empty">
          <div>🔍 No exact matches in Medicine Master Catalog.</div>
          <div class="dropdown-empty-hint">You can still use this as a brand new medicine entry.</div>
        </div>
        <div class="dropdown-add-card" onmousedown="event.preventDefault(); openAddMasterCatalogModal('${escapeJs(codeVal)}', '${escapeJs(descVal)}')">
          <div class="dropdown-add-badge">➕</div>
          <div class="dropdown-add-content">
            <div class="dropdown-add-title">Add to Master Formulary</div>
            <div class="dropdown-add-subtitle">Click to register "${typedSafe || 'New Medicine'}" into Medicine tab</div>
          </div>
        </div>
      `;
      return;
    }

    // Check if there is an exact match
    const hasExactMatch = matches.some(m => 
      (type === 'code' ? m.code.toUpperCase() === (query || '').toUpperCase().trim() : 
       m.desc.toUpperCase() === (query || '').toUpperCase().trim())
    );

    // Render top 60 matches for optimal scrolling performance
    const displayList = matches.slice(0, 60);
    let itemsHtml = displayList.map((item, idx) => {
      const codeHtml = highlightText(item.code, qLower);
      const descHtml = highlightText(item.desc, qLower);

      if (type === 'code') {
        return `
          <div class="dropdown-item" data-index="${idx}" onmousedown="event.preventDefault(); selectDciItem('${escapeJs(item.code)}', '${escapeJs(item.desc)}')">
            <span class="dropdown-item-code">${codeHtml}</span>
            <span class="dropdown-item-desc">${descHtml}</span>
          </div>
        `;
      } else {
        return `
          <div class="dropdown-item" data-index="${idx}" onmousedown="event.preventDefault(); selectDciItem('${escapeJs(item.code)}', '${escapeJs(item.desc)}')">
            <span class="dropdown-item-desc">${descHtml}</span>
            <span class="dropdown-item-code">${codeHtml}</span>
          </div>
        `;
      }
    }).join('');

    if (!hasExactMatch && (query || '').trim().length > 0) {
      itemsHtml += `
        <div class="dropdown-add-card" onmousedown="event.preventDefault(); openAddMasterCatalogModal('${escapeJs(codeVal)}', '${escapeJs(descVal)}')">
          <div class="dropdown-add-badge">➕</div>
          <div class="dropdown-add-content">
            <div class="dropdown-add-title">Add New Medicine to Master Catalog</div>
            <div class="dropdown-add-subtitle">Register "${typedSafe}" into Medicine sheet</div>
          </div>
        </div>
      `;
    }

    listEl.innerHTML = itemsHtml;
  }

  function handleComboboxKeydown(e, type) {
    const dropdown = document.getElementById(`dropdown-${type}`);
    const isOpen = dropdown && dropdown.style.display !== 'none';
    const items = dropdown ? dropdown.querySelectorAll('.dropdown-item') : [];

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (!isOpen) {
        openDropdown(type);
        renderDropdownItems(type, e.target.value.trim());
      } else if (items.length > 0) {
        state.focusedIndex = (state.focusedIndex + 1) % items.length;
        updateDropdownFocus(items);
      }
      return;
    }

    if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (isOpen && items.length > 0) {
        state.focusedIndex = (state.focusedIndex - 1 + items.length) % items.length;
        updateDropdownFocus(items);
      }
      return;
    }

    if (e.key === 'Enter' || e.key === 'Tab') {
      // 1. If an item is explicitly focused with arrow keys, select it
      if (isOpen && state.focusedIndex >= 0 && state.focusedIndex < items.length) {
        e.preventDefault();
        items[state.focusedIndex].dispatchEvent(new MouseEvent('mousedown'));
        return;
      }

      // 2. If dropdown is open and has items, and user typed something, auto-select top match on Enter or Tab
      if (isOpen && items.length > 0 && e.target.value.trim().length > 0) {
        if (e.key === 'Enter' || e.key === 'Tab') {
          e.preventDefault();
          items[0].dispatchEvent(new MouseEvent('mousedown'));
          return;
        }
      }

      // 3. If closed but user typed something and hit Enter, try resolving
      if (e.key === 'Enter') {
        e.preventDefault();
        if (type === 'desc') autoResolveDescToCode();
        else autoResolveCodeToDesc();
        return;
      }
    }

    if (e.key === 'Escape') {
      e.preventDefault();
      closeAllDropdowns();
    }
  }

  function updateDropdownFocus(items) {
    items.forEach((item, i) => {
      if (i === state.focusedIndex) {
        item.classList.add('focused');
        item.scrollIntoView({ block: 'nearest' });
      } else {
        item.classList.remove('focused');
      }
    });
  }

  function selectDciItem(code, desc) {
    const codeInput = document.getElementById('add-code');
    const descInput = document.getElementById('add-desc');
    const brandInput = document.getElementById('add-brand');
    const uomEl = document.getElementById('add-uom');

    if (codeInput) {
      codeInput.value = code;
      updateClearBtn('add-code', code);
      flashElement(codeInput);
    }
    if (descInput) {
      descInput.value = desc;
      updateClearBtn('add-desc', desc);
      flashElement(descInput);
    }

    if (uomEl && desc) {
      uomEl.value = detectUomFromText(desc);
      uomEl.dataset.userEdited = 'false';
      onUomSelectionChange();
    }

    hideMatchHint('code');
    hideMatchHint('desc');
    closeAllDropdowns();
    onAddCodeOrDescChange();

    // Smooth workflow: advance focus to brand name for incoming delivery
    if (brandInput && !brandInput.value) {
      setTimeout(() => brandInput.focus(), 80);
    }
  }

  function clearAddInput(inputId) {
    const codeInput = document.getElementById('add-code');
    const descInput = document.getElementById('add-desc');
    const previewBox = document.getElementById('add-batch-preview');

    if (codeInput) {
      codeInput.value = '';
      updateClearBtn('add-code', '');
      hideMatchHint('code');
    }
    if (descInput) {
      descInput.value = '';
      updateClearBtn('add-desc', '');
      hideMatchHint('desc');
    }
    const uomEl = document.getElementById('add-uom');
    if (uomEl) {
      uomEl.value = 'Tablet';
      uomEl.dataset.userEdited = 'false';
      onUomSelectionChange();
    }
    if (previewBox) {
      previewBox.style.display = 'none';
    }
    closeAllDropdowns();
    const input = document.getElementById(inputId);
    if (input) input.focus();
  }

  function resetDciSelection() {
    const codeInput = document.getElementById('add-code');
    const descInput = document.getElementById('add-desc');
    const previewBox = document.getElementById('add-batch-preview');

    if (codeInput) {
      codeInput.value = '';
      updateClearBtn('add-code', '');
    }
    if (descInput) {
      descInput.value = '';
      updateClearBtn('add-desc', '');
    }
    const uomEl = document.getElementById('add-uom');
    if (uomEl) {
      uomEl.value = 'Tablet';
      uomEl.dataset.userEdited = 'false';
      onUomSelectionChange();
    }
    hideMatchHint('code');
    hideMatchHint('desc');
    if (previewBox) {
      previewBox.style.display = 'none';
    }

    closeAllDropdowns();
    if (descInput) descInput.focus();
  }

  function highlightText(text, query) {
    if (!text) return '';
    if (!query) return escapeHtml(text);
    const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp(`(${escapedQuery})`, 'gi');
    return escapeHtml(text).replace(regex, '<mark class="dropdown-highlight">$1</mark>');
  }

  function escapeJs(str) {
    if (!str) return '';
    return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }

  function populateCatalogDatalists() {
    const badge = document.getElementById('catalog-count-badge');
    if (!state.masterCatalog || state.masterCatalog.length === 0) return;

    if (badge) {
      badge.textContent = `📋 ${state.masterCatalog.length} in Catalog`;
      badge.style.display = 'inline-block';
    }
  }

  function escapeHtml(text) {
    if (!text) return '';
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  // --- MASTER FORMULARY ADD CATALOG MODAL HANDLERS ---
  function onCatDescInput() {
    const desc = document.getElementById('cat-add-desc')?.value || '';
    const uom = detectUomFromText(desc);
    if (uom) {
      const select = document.getElementById('cat-add-uom');
      if (select) select.value = uom;
    }
  }

  function openAddMasterCatalogModal(initialCode, initialDesc) {
    const codeInput = document.getElementById('cat-add-code');
    const descInput = document.getElementById('cat-add-desc');
    const uomSelect = document.getElementById('cat-add-uom');
    const errBox = document.getElementById('cat-add-error');
    if (errBox) errBox.style.display = 'none';

    // Close any open combobox dropdowns
    closeAllDropdowns();

    const currCode = initialCode || document.getElementById('add-code')?.value.trim() || '';
    const currDesc = initialDesc || document.getElementById('add-desc')?.value.trim() || '';

    if (codeInput) codeInput.value = currCode.toUpperCase();
    if (descInput) descInput.value = currDesc.toUpperCase();

    const uom = detectUomFromText(currDesc);
    if (uomSelect && uom) {
      uomSelect.value = uom;
    }

    document.getElementById('modal-add-catalog').style.display = 'flex';
    setTimeout(() => {
      if (!currCode && codeInput) {
        codeInput.focus();
      } else if (descInput) {
        descInput.focus();
      }
    }, 50);
  }

  function submitAddMasterCatalog() {
    const codeInput = document.getElementById('cat-add-code');
    const descInput = document.getElementById('cat-add-desc');
    const uomSelect = document.getElementById('cat-add-uom');
    const saveBtn = document.getElementById('btn-save-catalog');
    const errBox = document.getElementById('cat-add-error');

    const code = (codeInput?.value || '').trim().toUpperCase();
    const desc = (descInput?.value || '').trim().toUpperCase();
    const uom = uomSelect?.value || 'Tablet';

    if (!code) {
      showCatError("Item Code / DCI Code is required.");
      codeInput?.focus();
      return;
    }
    if (!desc) {
      showCatError("Generic Description & Strength is required.");
      descInput?.focus();
      return;
    }

    if (errBox) errBox.style.display = 'none';
    if (saveBtn) {
      saveBtn.disabled = true;
      saveBtn.textContent = 'Registering...';
    }

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler((res) => {
          if (saveBtn) {
            saveBtn.disabled = false;
            saveBtn.textContent = 'Save to Master Catalog';
          }
          if (res && res.success) {
            // 1. Add to local state.masterCatalog if not already there
            const existingIdx = state.masterCatalog.findIndex(c => c.code.toUpperCase() === code);
            if (existingIdx === -1) {
              state.masterCatalog.push({ code: code, desc: desc });
              state.masterCatalog.sort((a, b) => a.desc.localeCompare(b.desc));
            }

            // 2. Update catalog badge counter
            populateCatalogDatalists();

            // 3. Auto-populate into Add Medicine form
            selectDciItem(code, desc);
            const formUom = document.getElementById('add-uom');
            if (formUom && uom) formUom.value = uom;

            // 4. Close modal & show toast
            closeModal('modal-add-catalog');
            showToast(res.message || `Successfully registered [${code}] into Master Catalog!`, 'success');
          } else {
            showCatError(res ? res.error : 'Failed to register into Master Catalog.');
          }
        })
        .withFailureHandler((err) => {
          if (saveBtn) {
            saveBtn.disabled = false;
            saveBtn.textContent = 'Save to Master Catalog';
          }
          showCatError(err.message || 'Error communicating with Google Sheets.');
        })
        .addMedicineToMasterCatalog({ itemCode: code, itemDesc: desc });
    } else {
      // Preview / offline mode
      setTimeout(() => {
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save to Master Catalog';
        }
        const existingIdx = state.masterCatalog.findIndex(c => c.code.toUpperCase() === code);
        if (existingIdx === -1) {
          state.masterCatalog.push({ code: code, desc: desc });
          state.masterCatalog.sort((a, b) => a.desc.localeCompare(b.desc));
        }
        populateCatalogDatalists();
        selectDciItem(code, desc);
        const formUom = document.getElementById('add-uom');
        if (formUom && uom) formUom.value = uom;
        closeModal('modal-add-catalog');
        showToast(`Registered [${code}] ${desc} into Master Catalog!`, 'success');
      }, 250);
    }
  }

  function showCatError(msg) {
    const errBox = document.getElementById('cat-add-error');
    if (errBox) {
      errBox.textContent = msg;
      errBox.style.display = 'block';
    }
  }
</script>

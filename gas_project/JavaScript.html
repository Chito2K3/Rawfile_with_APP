<script>
  // Global Application State
  const state = {
    items: [],
    filteredItems: [],
    logs: [],
    selectedRow: null,
    loading: false,
    activeTab: 'tab-inventory'
  };

  // On DOM Ready
  document.addEventListener('DOMContentLoaded', () => {
    initTabs();
    loadInventory();
  });

  // Tab Navigation Handling
  function initTabs() {
    const tabBtns = document.querySelectorAll('.tab-btn');
    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.dataset.tab;
        switchTab(target);
      });
    });
  }

  function switchTab(tabId) {
    state.activeTab = tabId;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));

    const activeBtn = document.querySelector(`.tab-btn[data-tab="${tabId}"]`);
    const activePane = document.getElementById(tabId);
    if (activeBtn) activeBtn.classList.add('active');
    if (activePane) activePane.classList.add('active');

    if (tabId === 'tab-logs') {
      loadLogs();
    } else if (tabId === 'tab-restock') {
      filterRestockTable();
    }
  }

  // Toast Notification System
  function showToast(message, type = 'info') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    
    let icon = 'ℹ️';
    if (type === 'success') icon = '✅';
    if (type === 'error') icon = '❌';

    toast.innerHTML = `<span>${icon}</span> <div>${message}</div>`;
    container.appendChild(toast);

    setTimeout(() => {
      toast.style.opacity = '0';
      setTimeout(() => toast.remove(), 300);
    }, 4500);
  }

  // Load Inventory from Google Apps Script Backend
  function loadInventory() {
    setLoading(true);
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(onInventoryLoaded)
        .withFailureHandler(onApiError)
        .getInventoryData();
    } else {
      // Mock Data for local testing / preview outside Google Apps Script
      console.warn("Running in preview mode (mock data with Brand & Price)");
      setTimeout(() => {
        onInventoryLoaded({
          success: true,
          items: [
            { rowIndex: 2, itemCode: 'DMDON001151', itemDesc: '(DON) CARBAMAZEPINE 200MG TABLET', brandName: 'Tegretol', qty: 3950, expDate: 'Feb-27', expYear: 2027, expStatus: 'NEAR_2027', acquisitionPrice: 12.50, isDonation: true, isZeroStock: false },
            { rowIndex: 3, itemCode: 'DMR000422', itemDesc: 'ESCITALOPRAM 10 MG TABLET', brandName: 'Lexapro', qty: 600, expDate: 'Mar-26', expYear: 2026, expStatus: 'CRITICAL_2026', acquisitionPrice: 28.00, isDonation: false, isZeroStock: false },
            { rowIndex: 4, itemCode: 'DMR000451', itemDesc: 'FLUCONAZOLE 200MG CAPSULE', brandName: 'Diflucan', qty: 200, expDate: 'Jun-28', expYear: 2028, expStatus: 'SAFE', acquisitionPrice: 125.00, isDonation: false, isZeroStock: false },
            { rowIndex: 5, itemCode: 'DMR000451', itemDesc: 'FLUCONAZOLE 200MG CAPSULE', brandName: 'Flucan', qty: 2000, expDate: 'Apr-29', expYear: 2029, expStatus: 'SAFE', acquisitionPrice: 45.00, isDonation: false, isZeroStock: false },
            { rowIndex: 6, itemCode: 'DMR001125', itemDesc: 'ZOLEDRONIC ACID 4MG/5ML VIAL', brandName: 'Zometa', qty: 0, expDate: 'Oct-27', expYear: 2027, expStatus: 'NEAR_2027', acquisitionPrice: 3500.00, isDonation: false, isZeroStock: true }
          ]
        });
      }, 500);
    }
  }

  function onInventoryLoaded(response) {
    setLoading(false);
    if (!response.success) {
      showToast(response.error || "Failed to load inventory.", "error");
      return;
    }

    state.items = response.items || [];
    renderStats();
    applyFilter();
    setupAutocomplete();
  }

  function onApiError(err) {
    setLoading(false);
    showToast(err.message || "An error occurred with Google Apps Script.", "error");
  }

  function setLoading(isLoading) {
    state.loading = isLoading;
    const spinner = document.getElementById('loading-spinner');
    if (spinner) {
      spinner.style.display = isLoading ? 'flex' : 'none';
    }
  }

  // Calculate & Render Stats Banner
  function renderStats() {
    const totalItems = state.items.length;
    const totalUnits = state.items.reduce((sum, item) => sum + (item.qty || 0), 0);
    const critical2026 = state.items.filter(i => i.expStatus === 'CRITICAL_2026').length;
    const near2027 = state.items.filter(i => i.expStatus === 'NEAR_2027').length;
    const zeroStock = state.items.filter(i => i.isZeroStock).length;

    document.getElementById('stat-total-items').textContent = totalItems.toLocaleString();
    document.getElementById('stat-total-qty').textContent = totalUnits.toLocaleString() + ' units';
    document.getElementById('stat-2026-count').textContent = critical2026;
    document.getElementById('stat-2027-count').textContent = near2027;
    document.getElementById('stat-zero-count').textContent = zeroStock;
  }

  // Filter and Live Search Logic (Matches Code, Generic, Brand, Expiry)
  function applyFilter() {
    const query = (document.getElementById('search-input').value || '').toLowerCase().trim();
    const statusFilter = document.getElementById('filter-status').value;

    state.filteredItems = state.items.filter(item => {
      const matchQuery = !query || 
        item.itemCode.toLowerCase().includes(query) || 
        item.itemDesc.toLowerCase().includes(query) ||
        (item.brandName && item.brandName.toLowerCase().includes(query)) ||
        item.expDate.toLowerCase().includes(query);

      let matchStatus = true;
      if (statusFilter === 'CRITICAL_2026') matchStatus = item.expStatus === 'CRITICAL_2026';
      else if (statusFilter === 'NEAR_2027') matchStatus = item.expStatus === 'NEAR_2027';
      else if (statusFilter === 'SAFE') matchStatus = item.expStatus === 'SAFE';
      else if (statusFilter === 'NO_EXPIRY') matchStatus = item.expStatus === 'NO_EXPIRY';
      else if (statusFilter === 'ZERO') matchStatus = item.isZeroStock;
      else if (statusFilter === 'DONATION') matchStatus = item.isDonation;

      return matchQuery && matchStatus;
    });

    renderInventoryTable();
  }

  // Render Main Inventory Table (Option A Layout: Code | Generic | Brand | Qty | Expiry | Price | Actions)
  function renderInventoryTable() {
    const tbody = document.getElementById('inventory-table-body');
    tbody.innerHTML = '';

    if (state.filteredItems.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:30px; color:#64748b;">No matching medicines found.</td></tr>`;
      return;
    }

    state.filteredItems.forEach(item => {
      const tr = document.createElement('tr');
      if (item.isZeroStock) tr.classList.add('zero-stock-row');

      let badgeHtml = '';
      if (item.expStatus === 'CRITICAL_2026') {
        badgeHtml = `<span class="badge badge-danger">🔴 2026 Risk (${item.expDate})</span>`;
      } else if (item.expStatus === 'NEAR_2027') {
        badgeHtml = `<span class="badge badge-warning">🟠 2027 Near (${item.expDate})</span>`;
      } else if (item.expStatus === 'SAFE') {
        badgeHtml = `<span class="badge badge-success">🟢 ${item.expDate}</span>`;
      } else {
        badgeHtml = `<span class="badge badge-neutral">⚪ ${item.expDate}</span>`;
      }

      const catBadge = item.isDonation 
        ? `<span class="badge badge-donation" style="margin-left:4px;">Donation</span>` 
        : '';

      const brandBadge = item.brandName 
        ? `<span class="badge badge-brand">${escapeHtml(item.brandName)}</span>`
        : `<span style="color:#94a3b8; font-style:italic;">--</span>`;

      const qtyDisplay = item.isZeroStock 
        ? `<span class="qty-zero">0 (Out of Stock)</span>` 
        : `<span class="qty-display">${item.qty.toLocaleString()}</span>`;

      const priceDisplay = (typeof item.acquisitionPrice === 'number' && item.acquisitionPrice > 0)
        ? `<span class="price-display">₱${item.acquisitionPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>`
        : `<span style="color:#94a3b8;">₱0.00</span>`;

      tr.innerHTML = `
        <td style="font-family:monospace; font-weight:600; color:#1e293b;">${escapeHtml(item.itemCode)}</td>
        <td>
          <div style="font-weight:600;">${escapeHtml(item.itemDesc)} ${catBadge}</div>
          <div style="font-size:11px; color:#64748b;">Row ${item.rowIndex} in Sheet</div>
        </td>
        <td>${brandBadge}</td>
        <td style="text-align:right;">${qtyDisplay}</td>
        <td>${badgeHtml}</td>
        <td style="text-align:right;">${priceDisplay}</td>
        <td style="text-align:right;">
          <div style="display:inline-flex; gap:6px;">
            <button class="btn btn-sm btn-danger" onclick="openStockOutModal(${item.rowIndex})" ${item.isZeroStock ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>
              ➖ Out
            </button>
            <button class="btn btn-sm btn-outline" onclick="openEditBatchModal(${item.rowIndex})">
              ✏️ Edit
            </button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  // --- STOCK OUT MODAL ACTIONS (BRAND + FINANCIAL DEDUCTION) ---
  function openStockOutModal(rowIndex) {
    const item = state.items.find(i => i.rowIndex === rowIndex);
    if (!item) return;

    state.selectedRow = item;
    document.getElementById('so-code').textContent = item.itemCode;
    document.getElementById('so-desc').textContent = item.itemDesc;
    
    const brandEl = document.getElementById('so-brand-badge');
    brandEl.textContent = item.brandName || 'Brand Batch';
    
    document.getElementById('so-exp').textContent = item.expDate;
    
    const unitPrice = typeof item.acquisitionPrice === 'number' ? item.acquisitionPrice : 0;
    document.getElementById('so-price').textContent = '₱' + unitPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    
    document.getElementById('so-current-qty').textContent = item.qty.toLocaleString() + ' units';
    document.getElementById('so-input-qty').value = '';
    document.getElementById('so-input-qty').max = item.qty;
    document.getElementById('so-remarks').value = '';
    document.getElementById('so-remaining-preview').textContent = item.qty.toLocaleString() + ' units';
    document.getElementById('so-cost-preview').textContent = '₱0.00';

    document.getElementById('modal-stock-out').style.display = 'flex';
    document.getElementById('so-input-qty').focus();
  }

  function updateStockOutPreview() {
    if (!state.selectedRow) return;
    const outVal = parseFloat(document.getElementById('so-input-qty').value) || 0;
    const rem = state.selectedRow.qty - outVal;
    const price = typeof state.selectedRow.acquisitionPrice === 'number' ? state.selectedRow.acquisitionPrice : 0;
    const totalCost = outVal > 0 ? (outVal * price) : 0;

    const previewRem = document.getElementById('so-remaining-preview');
    const previewCost = document.getElementById('so-cost-preview');

    if (rem < 0) {
      previewRem.textContent = 'Invalid (Exceeds current stock)';
      previewRem.style.color = '#dc2626';
      previewCost.textContent = '₱0.00';
    } else {
      previewRem.textContent = rem.toLocaleString() + ' units';
      previewRem.style.color = '#0f172a';
      previewCost.textContent = '₱' + totalCost.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
  }

  function submitStockOut() {
    if (!state.selectedRow) return;
    const qtyOut = parseFloat(document.getElementById('so-input-qty').value);
    const remarks = document.getElementById('so-remarks').value.trim();

    if (isNaN(qtyOut) || qtyOut <= 0) {
      showToast("Please enter a valid positive quantity to deduct.", "error");
      return;
    }

    if (qtyOut > state.selectedRow.qty) {
      showToast(`Cannot deduct ${qtyOut.toLocaleString()}! Current storage only has ${state.selectedRow.qty.toLocaleString()}.`, "error");
      return;
    }

    const payload = {
      rowIndex: state.selectedRow.rowIndex,
      itemCode: state.selectedRow.itemCode,
      qtyOut: qtyOut,
      remarks: remarks || 'Stock-Out Dispense'
    };

    setModalLoading('modal-stock-out', true);
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(res => {
          setModalLoading('modal-stock-out', false);
          closeModal('modal-stock-out');
          if (res.success) {
            showToast(res.message, "success");
            loadInventory();
          } else {
            showToast(res.error, "error");
          }
        })
        .withFailureHandler(err => {
          setModalLoading('modal-stock-out', false);
          showToast(err.message, "error");
        })
        .recordStockOut(payload);
    } else {
      // Mock local update
      state.selectedRow.qty -= qtyOut;
      state.selectedRow.isZeroStock = state.selectedRow.qty <= 0;
      const unitPrice = state.selectedRow.acquisitionPrice || 0;
      const totalCost = qtyOut * unitPrice;
      setModalLoading('modal-stock-out', false);
      closeModal('modal-stock-out');
      showToast(`[Mock] Deducted ${qtyOut.toLocaleString()} units of ${state.selectedRow.itemDesc} [${state.selectedRow.brandName}] (₱${totalCost.toFixed(2)})`, "success");
      renderStats();
      applyFilter();
    }
  }

  // --- EDIT / RESTOCK BATCH MODAL ---
  function openEditBatchModal(rowIndex) {
    const item = state.items.find(i => i.rowIndex === rowIndex);
    if (!item) return;

    state.selectedRow = item;
    document.getElementById('edit-code').value = item.itemCode;
    document.getElementById('edit-desc').value = item.itemDesc;
    document.getElementById('edit-brand').value = item.brandName || '';
    document.getElementById('edit-qty').value = item.qty;
    document.getElementById('edit-exp').value = item.expDate === 'NO EXPIRY' ? '' : item.expDate;
    document.getElementById('edit-price').value = item.acquisitionPrice || '';
    document.getElementById('edit-row-info').textContent = `Editing Google Sheet Row #${item.rowIndex}`;

    document.getElementById('modal-edit-batch').style.display = 'flex';
  }

  function submitEditBatch() {
    if (!state.selectedRow) return;
    const newDesc = document.getElementById('edit-desc').value.trim();
    const newBrand = document.getElementById('edit-brand').value.trim();
    const newQty = parseFloat(document.getElementById('edit-qty').value) || 0;
    const newExp = document.getElementById('edit-exp').value.trim();
    const newPrice = parseFloat(document.getElementById('edit-price').value) || 0;

    if (!newBrand) {
      showToast("Brand Name is required.", "error");
      return;
    }

    const payload = {
      rowIndex: state.selectedRow.rowIndex,
      itemCode: state.selectedRow.itemCode,
      itemDesc: newDesc,
      brandName: newBrand,
      newQty: newQty,
      newExpDate: newExp,
      acquisitionPrice: newPrice
    };

    setModalLoading('modal-edit-batch', true);
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(res => {
          setModalLoading('modal-edit-batch', false);
          closeModal('modal-edit-batch');
          if (res.success) {
            showToast(res.message, "success");
            loadInventory();
          } else {
            showToast(res.error, "error");
          }
        })
        .withFailureHandler(err => {
          setModalLoading('modal-edit-batch', false);
          showToast(err.message, "error");
        })
        .updateMedicineBatch(payload);
    } else {
      state.selectedRow.qty = newQty;
      state.selectedRow.expDate = newExp;
      state.selectedRow.itemDesc = newDesc;
      state.selectedRow.brandName = newBrand;
      state.selectedRow.acquisitionPrice = newPrice;
      state.selectedRow.isZeroStock = newQty <= 0;
      setModalLoading('modal-edit-batch', false);
      closeModal('modal-edit-batch');
      showToast(`[Mock] Batch updated successfully!`, "success");
      renderStats();
      applyFilter();
    }
  }

  // --- ADD MEDICINE / NEW BATCH SMART CHECK ---
  function onAddCodeOrDescChange() {
    const codeInput = document.getElementById('add-code').value.trim().toUpperCase();
    const previewBox = document.getElementById('add-batch-preview');
    const previewContent = document.getElementById('add-batch-preview-content');

    if (!codeInput) {
      previewBox.style.display = 'none';
      return;
    }

    // Check if itemCode already exists in inventory
    const existingBatches = state.items.filter(i => i.itemCode.toUpperCase() === codeInput);

    if (existingBatches.length > 0) {
      const matchDesc = existingBatches[0].itemDesc;
      if (!document.getElementById('add-desc').value) {
        document.getElementById('add-desc').value = matchDesc;
      }
      
      const lastRow = Math.max(...existingBatches.map(b => b.rowIndex));
      
      let html = `<div style="color:#2563eb; font-weight:700; margin-bottom:4px;">
        📌 Existing DCI Code Found (${existingBatches.length} batch${existingBatches.length > 1 ? 'es' : ''} in inventory):
      </div>`;
      html += `<ul style="padding-left:16px; margin-bottom:6px; line-height:1.6;">`;
      existingBatches.forEach(b => {
        const brandStr = b.brandName ? `Brand: <strong>${escapeHtml(b.brandName)}</strong>` : 'Generic';
        const priceStr = b.acquisitionPrice ? ` | Price: <strong>₱${Number(b.acquisitionPrice).toFixed(2)}</strong>` : '';
        html += `<li>Row ${b.rowIndex}: ${brandStr} | Qty <strong>${b.qty.toLocaleString()}</strong> | Expiry <strong>${b.expDate}</strong>${priceStr}</li>`;
      });
      html += `</ul>`;
      html += `<div style="background:#e0f2fe; padding:8px 12px; border-radius:6px; color:#0369a1; font-weight:600;">
        ✨ Smart Batch Grouping: This new brand delivery will be automatically inserted at <strong>Row ${lastRow + 1}</strong> (directly grouped below the last batch of this medicine).
      </div>`;

      previewContent.innerHTML = html;
      previewBox.style.display = 'block';
    } else {
      previewContent.innerHTML = `<span style="color:#059669; font-weight:600;">✨ New DCI Code: This medicine is not in the system yet. It will be added to the bottom of the inventory master list.</span>`;
      previewBox.style.display = 'block';
    }
  }

  function submitAddNew() {
    const code = document.getElementById('add-code').value.trim();
    const desc = document.getElementById('add-desc').value.trim();
    const brand = document.getElementById('add-brand').value.trim();
    const qty = parseFloat(document.getElementById('add-qty').value) || 0;
    const exp = document.getElementById('add-exp').value.trim();
    const price = parseFloat(document.getElementById('add-price').value) || 0;

    if (!code || !desc) {
      showToast("Please enter both DCI Item Code and Generic Description.", "error");
      return;
    }

    if (!brand) {
      showToast("Brand Name is required for every batch delivery.", "error");
      return;
    }

    const payload = {
      itemCode: code,
      itemDesc: desc,
      brandName: brand,
      qty: qty,
      expDate: exp,
      acquisitionPrice: price
    };

    setLoading(true);
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(res => {
          setLoading(false);
          if (res.success) {
            showToast(`${res.message} (${res.mode})`, "success");
            // Clear form
            document.getElementById('add-code').value = '';
            document.getElementById('add-desc').value = '';
            document.getElementById('add-brand').value = '';
            document.getElementById('add-qty').value = '';
            document.getElementById('add-exp').value = '';
            document.getElementById('add-price').value = '';
            document.getElementById('add-batch-preview').style.display = 'none';
            // Switch to inventory tab and reload
            switchTab('tab-inventory');
            loadInventory();
          } else {
            showToast(res.error, "error");
          }
        })
        .withFailureHandler(err => {
          setLoading(false);
          showToast(err.message, "error");
        })
        .addNewMedicineOrBatch(payload);
    } else {
      setLoading(false);
      showToast(`[Mock] Successfully saved ${code} - ${desc} [${brand}] (₱${price.toFixed(2)})`, "success");
      switchTab('tab-inventory');
    }
  }

  // --- RESTOCK TAB FILTER ---
  function filterRestockTable() {
    const zeroItems = state.items.filter(i => i.isZeroStock);
    const tbody = document.getElementById('restock-table-body');
    tbody.innerHTML = '';

    if (zeroItems.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:30px; color:#16a34a; font-weight:600;">🎉 No 0-quantity items! All inventory lines currently have stock.</td></tr>`;
      return;
    }

    zeroItems.forEach(item => {
      const tr = document.createElement('tr');
      const brandBadge = item.brandName 
        ? `<span class="badge badge-brand">${escapeHtml(item.brandName)}</span>` 
        : '<span style="color:#94a3b8;">--</span>';
      const priceDisplay = (item.acquisitionPrice > 0)
        ? `₱${item.acquisitionPrice.toFixed(2)}`
        : '₱0.00';

      tr.innerHTML = `
        <td style="font-family:monospace; font-weight:600;">${escapeHtml(item.itemCode)}</td>
        <td><strong>${escapeHtml(item.itemDesc)}</strong></td>
        <td>${brandBadge}</td>
        <td><span class="badge badge-neutral">${item.expDate}</span></td>
        <td style="text-align:right; font-family:monospace;">${priceDisplay}</td>
        <td><span class="qty-zero">0 units</span></td>
        <td style="text-align:right;">
          <button class="btn btn-sm btn-primary" onclick="openEditBatchModal(${item.rowIndex})">
            🔄 Restock & Update
          </button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  // --- STOCK OUT AUDIT LOGS ---
  function loadLogs() {
    const tbody = document.getElementById('logs-table-body');
    tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; padding:20px;">Loading audit logs...</td></tr>`;

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(res => {
          if (res.success) {
            renderLogsTable(res.logs || []);
          } else {
            tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; color:#dc2626;">${res.error}</td></tr>`;
          }
        })
        .withFailureHandler(err => {
          tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; color:#dc2626;">${err.message}</td></tr>`;
        })
        .getRecentLogs(50);
    } else {
      // Mock Logs
      renderLogsTable([
        { 
          timestamp: '2026-10-13 14:30:00', 
          itemCode: 'DMR000451', 
          itemDesc: 'FLUCONAZOLE 200MG CAPSULE', 
          brandName: 'Diflucan', 
          expDate: 'Jun-28', 
          unitPrice: 125.00, 
          qtyOut: 20, 
          totalCost: 2500.00, 
          previousQty: 200, 
          remainingBalance: 180, 
          remarks: 'ICU Dispense', 
          user: 'pharmacist@armmc.gov.ph' 
        }
      ]);
    }
  }

  function renderLogsTable(logs) {
    const tbody = document.getElementById('logs-table-body');
    tbody.innerHTML = '';

    if (logs.length === 0) {
      tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; padding:30px; color:#64748b;">No stock-out transactions recorded yet.</td></tr>`;
      return;
    }

    logs.forEach(log => {
      const tr = document.createElement('tr');
      const brandStr = log.brandName 
        ? `<span class="badge badge-brand">${escapeHtml(log.brandName)}</span>` 
        : '<span style="color:#94a3b8;">--</span>';
      
      const unitPriceFormatted = Number(log.unitPrice || 0) > 0 
        ? `₱${Number(log.unitPrice).toFixed(2)}` 
        : '₱0.00';

      const totalValueFormatted = Number(log.totalCost || 0) > 0 
        ? `₱${Number(log.totalCost).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}` 
        : '₱0.00';

      tr.innerHTML = `
        <td style="font-size:11px; color:#64748b; white-space:nowrap;">${log.timestamp}</td>
        <td style="font-family:monospace; font-weight:600;">${escapeHtml(log.itemCode)}</td>
        <td>${escapeHtml(log.itemDesc)}</td>
        <td>${brandStr}</td>
        <td><span class="badge badge-neutral">${log.expDate}</span></td>
        <td style="text-align:right; font-family:monospace;">${unitPriceFormatted}</td>
        <td style="text-align:right; font-weight:700; color:#dc2626;">-${Number(log.qtyOut).toLocaleString()}</td>
        <td style="text-align:right; font-family:monospace; font-weight:700; color:#047857;">${totalValueFormatted}</td>
        <td style="text-align:right; font-family:monospace;">${Number(log.remainingBalance).toLocaleString()}</td>
        <td style="font-size:12px; color:#475569;">${escapeHtml(log.remarks || '')}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  // Helpers
  function closeModal(modalId) {
    document.getElementById(modalId).style.display = 'none';
  }

  function setModalLoading(modalId, isLoading) {
    const modal = document.getElementById(modalId);
    const btns = modal.querySelectorAll('button');
    btns.forEach(b => b.disabled = isLoading);
  }

  function setupAutocomplete() {
    const codeInput = document.getElementById('add-code');
    if (!codeInput) return;
    codeInput.addEventListener('input', onAddCodeOrDescChange);
  }

  function escapeHtml(text) {
    if (!text) return '';
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
</script>
